[package]
name = "eradio"
version = "0.1.8"
edition = "2021"

[dependencies]
# Networking
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.0"

# Audio
rodio = { version = "0.17", default-features = false, features = ["symphonia-mp3"] }

# GUI (locked to compatible versions)
eframe = { version = "=0.28.1", default-features = false, features = ["default_fonts", "glow"] }
egui = "=0.28.1"

# Utilities
anyhow = "1.0"
regex = "1.0"
dirs = "5"
notify-rust = "4"
png = "0.17"

[build-dependencies]
winresource = "0.1"
ico = "0.3"
png = "0.17"

[profile.release]
opt-level = "z"       # optimize for size over speed
lto = true            # link-time optimization across all crates
codegen-units = 1     # single codegen unit for better optimization
panic = "abort"       # smaller than unwinding
strip = true          # strip debug symbols and metadata

[[bin]]
name = "eradio"
path = "src/main.rs"
