name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libfuse2 imagemagick

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Create AppImage
        run: |
          # Download linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          # Set up AppDir structure
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/share/applications

          cp target/release/eradio AppDir/usr/bin/
          convert eradio.png -resize 256x256! eradio-256.png
          cp eradio-256.png AppDir/usr/share/icons/hicolor/256x256/apps/eradio.png
          cp eradio.desktop AppDir/usr/share/applications/eradio.desktop

          # Build AppImage
          export VERSION="${GITHUB_REF_NAME#v}"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --icon-file eradio-256.png --desktop-file eradio.desktop --output appimage

          mv eRadio-*.AppImage eradio-linux-x86_64.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eradio-linux-x86_64
          path: eradio-linux-x86_64.AppImage

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Package
        run: |
          mkdir -p release
          cp target/x86_64-pc-windows-gnu/release/eradio.exe release/
          cp README.md release/
          cd release && zip ../eradio-windows-x86_64.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eradio-windows-x86_64
          path: eradio-windows-x86_64.zip

  build-flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev flatpak flatpak-builder

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: flatpak-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build binary
        run: cargo build --release

      - name: Set up Flatpak
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Build Flatpak
        run: |
          cp target/release/eradio eradio
          flatpak-builder --force-clean build-dir io.github.tedlaz.eradio.yml \
            --state-dir=.flatpak-builder \
            --install-deps-from=flathub
          flatpak build-export repo build-dir
          flatpak build-bundle repo eradio.flatpak io.github.tedlaz.eradio

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eradio-flatpak
          path: eradio.flatpak

  release:
    needs: [build-linux, build-windows, build-flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/eradio-linux-x86_64/eradio-linux-x86_64.AppImage
            artifacts/eradio-windows-x86_64/eradio-windows-x86_64.zip
            artifacts/eradio-flatpak/eradio.flatpak
